name: Card checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run project checks
        run: npm run check

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: plugin
